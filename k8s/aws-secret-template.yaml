# aws-secret-template.yaml — api-gateway-secret
#
# This file is a TEMPLATE only. It documents the shape of the Kubernetes Secret
# that the secrets-sync init container would materialise at runtime.
#
# api-gateway does not require application-level secrets from AWS Secrets Manager.
# The init container is kept in deployment.yaml for contract consistency and
# future extensibility (e.g. if an API key or signing cert is added later).
#
# DO NOT commit real secret values. This file must never contain actual credentials.
#
# If a secret is added in the future, follow the pattern:
#   1. Create the secret in AWS Secrets Manager under arch-analyzer/gateway/<name>
#   2. Update the init container command in deployment.yaml to fetch and write it
#   3. Add the key below and reference it via secretRef in the container envFrom
#
apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-secret
  namespace: arch-analyzer-api
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: arch-analyzer
    app.kubernetes.io/component: gateway
type: Opaque
stringData:
  # Placeholder — replace with actual keys when secrets are introduced.
  # EXAMPLE_KEY: "REPLACE_AT_RUNTIME"
