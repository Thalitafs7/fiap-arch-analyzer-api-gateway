apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: arch-analyzer-api
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: arch-analyzer
    app.kubernetes.io/component: gateway
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/part-of: arch-analyzer
        app.kubernetes.io/component: gateway
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        fsGroup: 10000

      volumes:
        - name: secrets-vol
          emptyDir:
            medium: Memory

      initContainers:
        - name: secrets-sync
          image: amazon/aws-cli:2.15.0
          # api-gateway has no secrets to fetch; init container kept for
          # consistency with the shared contract and future extensibility.
          command:
            - /bin/sh
            - -c
            - |
              echo "No secrets required for api-gateway" > /secrets/init.log
          volumeMounts:
            - name: secrets-vol
              mountPath: /secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

      containers:
        - name: api-gateway
          image: arch-analyzer-gateway:latest
          # Image resolved at deploy time via kustomization.yaml images override:
          #   newName: ${ECR_REGISTRY}/arch-analyzer-gateway
          #   newTag:  ${IMAGE_TAG}
          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: infra-outputs
            - configMapRef:
                name: api-gateway-config

          volumeMounts:
            - name: secrets-vol
              mountPath: /secrets
              readOnly: true

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
