name: CI Develop

on:
  push:
    branches:
      - "develop"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2

      - name: Terraform Init
        run: terraform init
        working-directory: ./infra/terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: ./infra/terraform

      - name: Terraform Plan
        run: terraform plan -var="aws_region=us-east-1"
        working-directory: ./infra/terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

  create-release-pr:
    needs: [build-and-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout do código completo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Criar ou usar branch de release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          set -e

          echo "🔍 Buscando a última versão de release..."
          git fetch origin --prune --tags
          LATEST_RELEASE_VERSION=$(git ls-remote --heads origin "release/*" | awk -F'/' '{print $4}' | sort -V | tail -n 1 || true)

          if [ -z "$LATEST_RELEASE_VERSION" ]; then
            echo "⚠️ Nenhuma branch de release encontrada. A próxima versão será 1.0.0."
            NEXT_VERSION="1.0.0"
          else
            echo "✅ Última versão de release detectada: $LATEST_RELEASE_VERSION"

            # Analisar a mensagem do último commit na develop para decidir o incremento (Semantic Versioning)
            # BREAKING CHANGE ou ! -> MAJOR
            # feat: -> MINOR
            # Outros (fix, docs, refactor, etc) -> PATCH

            LAST_COMMIT_MSG=$(git log -1 --pretty=%B)
            echo "📝 Mensagem do último commit: $LAST_COMMIT_MSG"

            INCREMENT="patch"
            if echo "$LAST_COMMIT_MSG" | grep -Eq "BREAKING CHANGE|!"; then
              INCREMENT="major"
            elif echo "$LAST_COMMIT_MSG" | grep -iq "^feat"; then
              INCREMENT="minor"
            fi

            echo "📈 Tipo de incremento detectado: $INCREMENT"

            # Divide a versão por '.' e preenche com 0 se faltar partes
            IFS='.' read -r -a version_parts <<< "$LATEST_RELEASE_VERSION"
            major=${version_parts[0]:-0}
            minor=${version_parts[1]:-0}
            patch=${version_parts[2]:-0}

            if [ "$INCREMENT" == "major" ]; then
              major=$((major + 1))
              minor=0
              patch=0
            elif [ "$INCREMENT" == "minor" ]; then
              minor=$((minor + 1))
              patch=0
            else
              patch=$((patch + 1))
            fi

            NEXT_VERSION="$major.$minor.$patch"
            echo "⬆️ Próxima versão de release calculada: $NEXT_VERSION"
          fi

          RELEASE_BRANCH="release/$NEXT_VERSION"
          echo "🎯 A branch de release alvo é: $RELEASE_BRANCH"

          echo "🔍 Verificando se a branch de release alvo já existe no remoto..."
          if git ls-remote --heads origin "$RELEASE_BRANCH" | grep -q "$RELEASE_BRANCH"; then
            echo "✅ A branch de release '$RELEASE_BRANCH' já existe no remoto."
          else
            echo "✨ Criando branch de release '$RELEASE_BRANCH' a partir da main..."
            git checkout main
            git pull origin main
            git checkout -b "$RELEASE_BRANCH"
            git push origin "$RELEASE_BRANCH"
          fi

          echo "🔍 Verificando PRs abertos de develop para $RELEASE_BRANCH..."
          PR_LIST=$(gh pr list --state open --head "develop" --base "$RELEASE_BRANCH" --json number)
          OPEN_PR_COUNT=$(echo "$PR_LIST" | jq 'length')

          if [ -z "$OPEN_PR_COUNT" ] || [ "$OPEN_PR_COUNT" -eq 0 ]; then
            echo "✨ Criando novo Pull Request..."
            gh pr create \
              --base "$RELEASE_BRANCH" \
              --head "develop" \
              --title "Merge develop into $RELEASE_BRANCH" \
              --body "Pull Request gerado automaticamente pela pipeline CI de develop."
          else
            echo "ℹ️ Já existe PR aberto para $RELEASE_BRANCH."
          fi
