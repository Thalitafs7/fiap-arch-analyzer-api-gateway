name: CI Feature

on:
  push:
    branches:
      - "feature/*"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: ./infra/terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: ./infra/terraform

      - name: Terraform Plan
        run: terraform plan -var="aws_region=us-east-1"
        working-directory: ./infra/terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

  create-pr-to-develop:
    needs: [build-and-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout do código completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Criar Pull Request para develop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          set -e

          TARGET_BRANCH="develop"
          SOURCE_BRANCH="${{ github.ref_name }}"

          echo "🔍 Verificando se a branch $TARGET_BRANCH existe..."
          if ! git ls-remote --heads origin "$TARGET_BRANCH" | grep -q "$TARGET_BRANCH"; then
            echo "✨ A branch $TARGET_BRANCH não existe. Criando a partir da main..."
            git checkout main
            git checkout -b "$TARGET_BRANCH"
            git push origin "$TARGET_BRANCH"
          fi

          echo "🔍 Verificando se há diferenças entre $SOURCE_BRANCH e $TARGET_BRANCH..."
          git fetch origin "$TARGET_BRANCH"
          if git diff --quiet "origin/$TARGET_BRANCH"...origin/"$SOURCE_BRANCH"; then
            echo "⚠️ Nenhuma diferença. Nenhum PR será criado."
            exit 0
          fi

          echo "🔍 Verificando PRs abertos..."
          PR_LIST=$(gh pr list --state open --head "$SOURCE_BRANCH" --base "$TARGET_BRANCH" --json number)
          OPEN_PR_COUNT=$(echo "$PR_LIST" | jq 'length')

          if [ -z "$OPEN_PR_COUNT" ] || [ "$OPEN_PR_COUNT" -eq 0 ]; then
            echo "✨ Criando novo Pull Request para $TARGET_BRANCH..."
            gh pr create \
              --base "$TARGET_BRANCH" \
              --head "$SOURCE_BRANCH" \
              --title "Merge $SOURCE_BRANCH into $TARGET_BRANCH" \
              --body "PR gerado automaticamente após sucesso no CI da feature."
          else
            echo "ℹ️ Já existe PR aberto."
          fi
