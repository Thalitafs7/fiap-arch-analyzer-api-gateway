name: CI Feature

on:
  push:
    branches:
      - "feature/*"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 9.0.x

      - name: Restaurar dependências
        run: dotnet restore || echo "No solution file found yet, skipping"

      - name: Compilar o projeto
        run: dotnet build --no-restore || echo "No solution file found yet, skipping"

      - name: Executar testes unitários
        run: |
          if [ -f .github/scripts/check_test_success.sh ]; then
            chmod +x .github/scripts/check_test_success.sh
            .github/scripts/check_test_success.sh
          else
            echo "Test script not found, skipping"
          fi

      - name: Construir imagem Docker para validação
        run: |
          if [ -f Dockerfile ]; then
            docker build . --file Dockerfile --tag mecanica-os-api:latest
          else
            echo "Dockerfile not found, skipping build validation"
          fi

  create-pr-to-develop:
    needs: [build-and-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout do código completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Criar Pull Request para develop
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -e

          TARGET_BRANCH="develop"
          SOURCE_BRANCH="${{ github.ref_name }}"

          echo "🔍 Verificando se a branch $TARGET_BRANCH existe..."
          if ! git ls-remote --heads origin "$TARGET_BRANCH" | grep -q "$TARGET_BRANCH"; then
            echo "✨ A branch $TARGET_BRANCH não existe. Criando a partir da main..."
            git checkout main
            git checkout -b "$TARGET_BRANCH"
            git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git
            git push origin "$TARGET_BRANCH"
          fi

          echo "🔍 Verificando se há diferenças entre $SOURCE_BRANCH e $TARGET_BRANCH..."
          git fetch origin "$TARGET_BRANCH"
          if git diff --quiet "origin/$TARGET_BRANCH"...origin/"$SOURCE_BRANCH"; then
            echo "⚠️ Nenhuma diferença. Nenhum PR será criado."
            exit 0
          fi

          echo "🔍 Verificando PRs abertos..."
          PR_LIST=$(gh pr list --state open --head "$SOURCE_BRANCH" --base "$TARGET_BRANCH" --json number)
          OPEN_PR_COUNT=$(echo "$PR_LIST" | jq 'length')

          if [ -z "$OPEN_PR_COUNT" ] || [ "$OPEN_PR_COUNT" -eq 0 ]; then
            echo "✨ Criando novo Pull Request para $TARGET_BRANCH..."
            gh pr create \
              --base "$TARGET_BRANCH" \
              --head "$SOURCE_BRANCH" \
              --title "Merge $SOURCE_BRANCH into $TARGET_BRANCH" \
              --body "PR gerado automaticamente após sucesso no CI da feature."
          else
            echo "ℹ️ Já existe PR aberto."
          fi
